[package]
name = "mlx-rs-vlm"
version = "0.1.0"
edition = "2024"

[dependencies]
mlx-rs = { git = "https://github.com/kadu-v/mlx-rs", tag = "v0.25.3-ios" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokenizers = "0.21"
safetensors = "0.5"
anyhow = "1"
hf-hub = { version = "1.0.0-rc.1", features = ["blocking"] }
